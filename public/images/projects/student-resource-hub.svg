<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b13"/>
      <stop offset="50%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="accentLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Browser Shell UI -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#0c101c" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="60" y="50" width="680" height="42" rx="14" fill="#131929"/>
  
  <!-- Window dots -->
  <circle cx="90" cy="71" r="5.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="110" cy="71" r="5.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="130" cy="71" r="5.5" fill="#10b981" opacity="0.8"/>
  
  <!-- Address bar -->
